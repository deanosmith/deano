<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="description" content="Dean M. Smith - Data Platform Engineer based in Copenhagen." />
  <meta name="theme-color" content="#050505" />
  <title>Dean M. Smith</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* ── Tokens ──────────────────────────────────────────── */
    :root {
      --bg:          #050505;
      --surface:     rgba(255, 255, 255, 0.028);
      --gold:        #c8973a;
      --gold-bright: #e2b354;
      --gold-glow:   rgba(200, 151, 58, 0.22);
      --text:        #f0ede6;
      --muted:       #575250;
      --border:      rgba(200, 151, 58, 0.1);
      --r:           18px;
      --r-pill:      100px;
    }

    /* ── Base ────────────────────────────────────────────── */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
                   'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      cursor: none;
    }
    body.custom-cursor,
    body.custom-cursor * {
      cursor: none !important;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Cursor — atomic orbit ───────────────────────────── */
    #cursor-atom {
      position: fixed;
      top: 0; left: 0;
      width: 32px; height: 32px;
      --orbit-x: 14px;
      --orbit-y: 6px;
      --orbit-peak: 7px;
      pointer-events: none;
      transform: translate3d(-50%, -50%, 0);
      will-change: transform;
      z-index: 10000;
    }
    #cursor-atom.hover {
      --orbit-x: 21px;
      --orbit-y: 9px;
      --orbit-peak: 10px;
    }
    .cursor-nucleus,
    .cursor-electron {
      position: absolute;
      left: 50%; top: 50%;
      pointer-events: none;
    }
    .cursor-nucleus {
      width: 5px; height: 5px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--gold-bright);
      box-shadow: 0 0 18px rgba(226,179,84,0.55);
      transition: transform 0.22s ease, background 0.22s ease;
      z-index: 2;
    }
    .cursor-electron {
      width: 4px; height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 12px rgba(240,237,230,0.5);
      animation: atom-orbit 1.55s linear infinite;
      will-change: transform, opacity;
    }
    .cursor-electron.secondary {
      width: 3px; height: 3px;
      margin: -1.5px 0 0 -1.5px;
      background: var(--gold-bright);
      box-shadow: 0 0 12px rgba(226,179,84,0.5);
      animation-name: atom-orbit-secondary;
      animation-duration: 1.85s;
    }
    #cursor-atom.hover .cursor-nucleus {
      transform: translate(-50%, -50%) scale(1.28);
      background: var(--text);
    }
    #cursor-atom.hover .cursor-electron {
      animation-duration: 1.18s;
    }
    #cursor-atom.hover .cursor-electron.secondary {
      animation-duration: 1.38s;
    }
    @keyframes atom-orbit {
      0% {
        transform: translate3d(var(--orbit-x), var(--orbit-y), 0) scale(1.12);
        opacity: 1;
        z-index: 3;
      }
      25% {
        transform: translate3d(0, calc(-1 * var(--orbit-peak)), 0) scale(0.72);
        opacity: 0.5;
        z-index: 1;
      }
      50% {
        transform: translate3d(calc(-1 * var(--orbit-x)), calc(-1 * var(--orbit-y)), 0) scale(0.64);
        opacity: 0.32;
        z-index: 1;
      }
      75% {
        transform: translate3d(0, var(--orbit-peak), 0) scale(1.18);
        opacity: 1;
        z-index: 3;
      }
      100% {
        transform: translate3d(var(--orbit-x), var(--orbit-y), 0) scale(1.12);
        opacity: 1;
        z-index: 3;
      }
    }
    @keyframes atom-orbit-secondary {
      0% {
        transform: translate3d(calc(-0.78 * var(--orbit-x)), calc(1.28 * var(--orbit-y)), 0) scale(0.7);
        opacity: 0.38;
        z-index: 1;
      }
      25% {
        transform: translate3d(calc(0.48 * var(--orbit-x)), calc(-1.08 * var(--orbit-peak)), 0) scale(1.08);
        opacity: 0.95;
        z-index: 3;
      }
      50% {
        transform: translate3d(calc(0.82 * var(--orbit-x)), calc(-1.24 * var(--orbit-y)), 0) scale(1.16);
        opacity: 1;
        z-index: 3;
      }
      75% {
        transform: translate3d(calc(-0.42 * var(--orbit-x)), calc(1.05 * var(--orbit-peak)), 0) scale(0.72);
        opacity: 0.42;
        z-index: 1;
      }
      100% {
        transform: translate3d(calc(-0.78 * var(--orbit-x)), calc(1.28 * var(--orbit-y)), 0) scale(0.7);
        opacity: 0.38;
        z-index: 1;
      }
    }

    /* ── Background ──────────────────────────────────────── */
    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .orb {
      position: fixed; border-radius: 50%;
      pointer-events: none; z-index: 0; filter: blur(100px);
    }
    .orb-a {
      width: 700px; height: 700px; top: -200px; left: -180px;
      background: radial-gradient(circle, rgba(200,151,58,0.13) 0%, transparent 68%);
      animation: drift-a 24s ease-in-out infinite alternate;
    }
    .orb-b {
      width: 560px; height: 560px; bottom: -120px; right: -140px;
      background: radial-gradient(circle, rgba(200,151,58,0.09) 0%, transparent 68%);
      animation: drift-b 30s ease-in-out infinite alternate;
    }
    .orb-c {
      width: 380px; height: 380px; top: 42%; left: 52%;
      background: radial-gradient(circle, rgba(175,128,28,0.055) 0%, transparent 68%);
      animation: drift-c 20s ease-in-out infinite alternate;
    }
    @keyframes drift-a { to { transform: translate(90px, 70px); } }
    @keyframes drift-b { to { transform: translate(-70px, -90px); } }
    @keyframes drift-c { to { transform: translate(-30px, 50px) scale(1.35); } }

    /* ── Glass card ──────────────────────────────────────── */
    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      position: relative; overflow: hidden;
    }
    .glass::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(200,151,58,0.18) 25%,
        rgba(255,255,255,0.05) 55%,
        transparent 100%);
      border-radius: var(--r) var(--r) 0 0;
    }

    /* ── Layout ──────────────────────────────────────────── */
    main { position: relative; z-index: 1; }

    /* 50/50 split */
    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      border-bottom: 1px solid var(--border);
    }

    /* ── Left Panel ──────────────────────────────────────── */
    .split-left {
      position: sticky;
      top: 0;
      height: 100dvh;
      padding: 72px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .hero-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(200,151,58,0.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,151,58,0.016) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 30% 50%, black 0%, transparent 100%);
              mask-image: radial-gradient(ellipse 80% 80% at 30% 50%, black 0%, transparent 100%);
    }

    .hero-halo {
      position: absolute; top: 45%; left: 26%;
      transform: translate(-50%, -50%);
      width: 580px; height: 580px;
      background: radial-gradient(ellipse at center, rgba(200,151,58,0.065) 0%, transparent 62%);
      pointer-events: none; border-radius: 50%;
      animation: halo-breathe 9s ease-in-out infinite alternate;
    }
    @keyframes halo-breathe {
      from { opacity: 0.65; transform: translate(-50%,-50%) scale(1); }
      to   { opacity: 1;    transform: translate(-50%,-50%) scale(1.12); }
    }

    .left-identity { position: relative; z-index: 1; }

    .hero-loc {
      font-size: 11px; letter-spacing: 0.06em; color: var(--muted);
      margin-bottom: 22px;
      opacity: 0; animation: riseIn 0.85s ease forwards 0.35s;
    }
    .hero-name {
      font-size: clamp(50px, 6vw, 100px);
      font-weight: 600; letter-spacing: -0.04em; line-height: 0.88;
      margin-bottom: 14px;
      opacity: 0; animation: riseIn 0.85s ease forwards 0.15s;
    }
    .hero-name .accent {
      color: var(--gold);
      animation: gold-shimmer 5s ease-in-out infinite;
    }
    @keyframes gold-shimmer {
      0%, 100% { text-shadow: 0 0 60px rgba(200,151,58,0.2); }
      50%       { text-shadow: 0 0 90px rgba(200,151,58,0.45), 0 0 180px rgba(200,151,58,0.15); }
    }
    .hero-tagline {
      font-size: 16px; color: var(--text);
      max-width: 340px; line-height: 1.8;
      opacity: 0; animation: riseIn 0.85s ease forwards 0.6s;
    }

    /* Compact snapshot in left panel */
    .hero-snapshot {
      display: grid; gap: 10px;
      position: relative; z-index: 1;
      opacity: 0; animation: riseIn 0.85s ease forwards 0.78s;
    }
    .snapshot-item {
      display: grid;
      grid-template-columns: 86px 1fr;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-top: 1px solid rgba(200,151,58,0.08);
    }
    .snapshot-item:last-child {
      border-bottom: 1px solid rgba(200,151,58,0.08);
    }
    .snapshot-label {
      font-size: 10px;
      letter-spacing: 0.09em;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .snapshot-copy {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      opacity: 0.86;
    }
    .snapshot-copy strong {
      color: var(--gold-bright);
      font-weight: 500;
      opacity: 1;
    }
    .snapshot-icons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .stack-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 0 10px rgba(200,151,58,0.12));
      transition: transform 0.22s ease, filter 0.22s ease;
    }
    .stack-icon.invert {
      filter: invert(1) drop-shadow(0 0 10px rgba(200,151,58,0.12));
    }
    .stack-icon.lg {
      width: 44px;
      height: 44px;
    }
    .snapshot-item:hover .stack-icon {
      transform: translateY(-1px);
      filter: drop-shadow(0 0 12px rgba(200,151,58,0.28));
    }
    .snapshot-item:hover .stack-icon.invert {
      filter: invert(1) drop-shadow(0 0 12px rgba(200,151,58,0.28));
    }

    /* Scroll hint */
    .scroll-hint {
      display: flex; align-items: center; gap: 14px;
      position: relative; z-index: 1;
      opacity: 0; animation: riseIn 0.85s ease forwards 1.05s;
    }
    .scroll-bar {
      width: 44px; height: 1px;
      background: var(--border); border-radius: var(--r-pill);
      position: relative; overflow: hidden;
    }
    .scroll-bar::after {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(to right, transparent, var(--gold));
      animation: sweep 2.4s ease-in-out infinite;
    }
    @keyframes sweep { from { left: -100%; } to { left: 100%; } }
    .scroll-hint span { font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }

    /* ── Right Panel ─────────────────────────────────────── */
    .split-right { padding: 72px 60px; }

    .right-section { margin-bottom: 68px; }
    .right-section:last-child { margin-bottom: 0; }

    .eyebrow {
      font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 10px;
    }
    .section-title {
      font-size: clamp(30px, 3vw, 46px);
      font-weight: 600; letter-spacing: -0.03em; line-height: 1.02;
      margin-bottom: 30px;
    }

    /* ── About ───────────────────────────────────────────── */
    .about-bio {
      font-size: 17px; color: var(--text);
      line-height: 1.9; margin-bottom: 24px;
    }
    .about-bio strong { color: var(--gold-bright); font-weight: 500; }
    .about-card { padding: 22px 24px; }
    .about-card p { font-size: 15px; color: var(--text); line-height: 1.7; }
    .about-card p + p { margin-top: 6px; }

    /* ── Experience Timeline ─────────────────────────────── */
    /* Line sits at left: 8px; padding gives room for 16px dots */
    .timeline { position: relative; padding-left: 52px; }
    .timeline::before {
      content: ''; position: absolute;
      left: 8px; top: 30px; bottom: 8px; width: 1px;
      background: linear-gradient(to bottom, var(--gold) 0%, rgba(200,151,58,0.08) 100%);
      border-radius: var(--r-pill);
    }
    .tl-item { position: relative; margin-bottom: 18px; }
    .tl-item:last-child { margin-bottom: 0; }

    /* Large dot precisely centred on the line (line-center = 8.5px from timeline left;
       item starts 52px in → dot centre = 8.5−52 = −43.5px from item; left = −43.5−8 = −51.5 ≈ −52px) */
    .tl-dot {
      position: absolute; left: -52px; top: 22px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(200,151,58,0.12), 0 0 16px rgba(200,151,58,0.5);
      z-index: 2;
    }

    /* Pulsing dot for current role */
    .tl-dot.active {
      background: var(--gold-bright);
      animation: tl-pulse 2s ease-out infinite;
    }
    @keyframes tl-pulse {
      0%   { box-shadow: 0 0 0 0    rgba(200,151,58,0.85); }
      70%  { box-shadow: 0 0 0 14px rgba(200,151,58,0); }
      100% { box-shadow: 0 0 0 0    rgba(200,151,58,0); }
    }

    .tl-card {
      padding: 26px 30px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .tl-card:hover {
      border-color: rgba(200,151,58,0.28);
      box-shadow: 0 0 36px rgba(200,151,58,0.07), 0 8px 48px rgba(0,0,0,0.3);
    }
    .tl-row {
      display: flex; justify-content: space-between;
      align-items: flex-start; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 5px;
    }
    .tl-title   { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    .tl-date    { font-size: 14px; color: var(--text); letter-spacing: 0.02em; white-space: nowrap; }
    .tl-company { font-size: 14px; color: var(--gold); margin-bottom: 4px; }
    .tl-loc     { font-size: 13px; color: var(--text); margin-bottom: 12px; }
    .tl-desc    { font-size: 14px; color: var(--text); line-height: 1.72; margin-bottom: 14px; opacity: 0.82; }
    .tag-row    { display: flex; flex-wrap: wrap; gap: 6px; }
    .tl-header  {
      display: block; width: 100%;
      cursor: pointer; user-select: none; position: relative; padding: 0 26px 0 0;
      appearance: none; border: 0; background: transparent; color: inherit;
      font: inherit; text-align: left;
    }
    .tl-header::after {
      content: '+';
      position: absolute; right: 0; top: 1px;
      color: var(--gold); font-size: 20px; font-weight: 300; line-height: 1;
      transition: transform 0.3s;
    }
    .tl-card.expanded .tl-header::after { content: '-'; }
    .tl-body {
      height: 0; overflow: hidden; opacity: 0;
      transition: height 0.34s cubic-bezier(.22,.61,.36,1),
                  opacity 0.22s ease,
                  margin-top 0.24s ease;
      margin-top: 0;
      will-change: height, opacity;
    }
    .tl-card.expanded .tl-body {
      opacity: 1; margin-top: 14px;
    }
    .tl-body-inner {
      overflow: hidden;
    }
    .tl-copy {
      font-size: 14px; color: var(--text); line-height: 1.72;
      opacity: 0.84; margin-bottom: 16px;
    }
    .tl-copy p + p,
    .tl-copy ul + p,
    .tl-copy p + ul {
      margin-top: 12px;
    }
    .tl-copy ul {
      margin: 8px 0 14px 18px;
      padding-left: 0;
      list-style-type: disc;
    }
    .tl-copy ul ul {
      margin: 6px 0 8px 18px;
      list-style-type: circle;
    }
    .tl-copy li {
      padding-left: 4px;
      margin: 5px 0;
    }
    .tl-copy li::marker,
    .tl-subhead {
      color: var(--gold);
    }
    .tl-subhead {
      font-weight: 500;
    }
    .tl-copy strong {
      color: var(--gold-bright);
      font-weight: 500;
      opacity: 1;
    }
    .tag {
      font-size: 12px; padding: 4px 12px; letter-spacing: 0.02em;
      border: 1px solid var(--border); border-radius: var(--r-pill); color: var(--text);
    }

    /* ── Full-width sections below split ─────────────────── */
    .section {
      padding: 100px 64px;
      border-top: 1px solid var(--border);
    }
    .section .eyebrow { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; }
    .section .section-title {
      font-size: clamp(34px, 4.5vw, 58px);
      margin-bottom: 52px;
    }

    /* ── Projects ────────────────────────────────────────── */
    .projects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .proj-card {
      display: block;
      padding: 36px;
      transition: border-color 0.35s, box-shadow 0.35s, transform 0.35s;
    }
    .proj-card::after {
      content: '';
      position: absolute; inset: 0; border-radius: var(--r);
      background: radial-gradient(ellipse at 0% 0%, rgba(200,151,58,0.07) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.35s; pointer-events: none;
    }
    .proj-card:hover {
      border-color: rgba(200,151,58,0.3);
      box-shadow: 0 0 48px rgba(200,151,58,0.09), 0 14px 52px rgba(0,0,0,0.38);
      transform: translateY(-5px);
    }
    .proj-card:hover::after { opacity: 1; }
    .proj-num   { font-size: 11px; color: var(--gold); letter-spacing: 0.05em; margin-bottom: 14px; }
    .proj-content {
      display: flex; gap: 28px; align-items: flex-start;
    }
    .proj-text  { flex: 1; display: flex; flex-direction: column; }
    .proj-thumb {
      width: min(42%, 220px); flex-shrink: 0;
      aspect-ratio: 4 / 3; height: auto;
      border-radius: calc(var(--r) - 4px);
      object-fit: contain; padding: 8px;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
    }
    .proj-title { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 10px; }
    .proj-desc  { font-size: 16px; color: var(--text); line-height: 1.72; margin-bottom: 22px; }
    .proj-features {
      list-style: none;
      display: grid;
      gap: 7px;
      margin: -8px 0 20px;
    }
    .proj-features li {
      position: relative;
      padding-left: 16px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      opacity: 0.82;
    }
    .proj-features li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.62em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(200,151,58,0.38);
    }
    .proj-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; letter-spacing: 0.04em; color: var(--gold);
      transition: gap 0.3s; margin-top: auto; padding-top: 16px;
    }
    .proj-card:hover .proj-link { gap: 14px; }

    /* ── Contact ─────────────────────────────────────────── */
    #contact { text-align: center; }
    .connect-icons {
      display: flex; justify-content: center; gap: 24px; margin-top: 52px; flex-wrap: wrap;
    }
    .connect-btn {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 40px 52px;
      border: 1px solid var(--border); border-radius: var(--r);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      background: var(--surface); color: var(--text); min-width: 160px;
      transition: color 0.25s, border-color 0.25s, background 0.25s, box-shadow 0.25s, transform 0.28s;
    }
    .connect-btn:hover {
      color: var(--gold-bright); border-color: rgba(200,151,58,0.4);
      background: rgba(200,151,58,0.06);
      box-shadow: 0 0 48px rgba(200,151,58,0.12), 0 12px 40px rgba(0,0,0,0.3);
      transform: translateY(-6px);
    }
    .connect-btn svg { transition: transform 0.28s; }
    .connect-btn:hover svg { transform: scale(1.08); }
    .connect-btn span { font-size: 15px; letter-spacing: 0.04em; font-weight: 500; }

    /* ── Footer ──────────────────────────────────────────── */
    footer {
      position: relative; z-index: 1;
      padding: 28px 64px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    footer p, .footer-nav a { font-size: 11px; letter-spacing: 0.04em; color: var(--muted); }
    .footer-nav { display: flex; gap: 24px; }
    .footer-nav a { transition: color 0.22s; }
    .footer-nav a:hover { color: var(--gold); }

    /* ── Animations ──────────────────────────────────────── */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal {
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.72s ease, transform 0.72s ease;
    }
    .reveal.in { opacity: 1; transform: none; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 920px) {
      .split-layout     { grid-template-columns: 1fr; }

    function createEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function appendLines(parent, lines) {
      lines.forEach((line, index) => {
        if (index > 0) parent.append(document.createElement('br'));
        parent.append(document.createTextNode(line));
      });
    }

    function appendHighlightedText(parent, text, highlights = []) {
      const terms = highlights.slice().sort((a, b) => b.length - a.length);
      let index = 0;

      while (index < text.length) {
        let nextTerm = null;
        let nextIndex = text.length;

        for (const term of terms) {
          const found = text.indexOf(term, index);
          if (found !== -1 && found < nextIndex) {
            nextTerm = term;
            nextIndex = found;
          }
        }

        if (!nextTerm) {
          parent.append(document.createTextNode(text.slice(index)));
          break;
        }

        if (nextIndex > index) {
          parent.append(document.createTextNode(text.slice(index, nextIndex)));
        }

        const strong = createEl('strong', '', nextTerm);
        parent.append(strong);
        index = nextIndex + nextTerm.length;
      }
    }

    function createStackIcons(icons) {
      const row = createEl('div', 'snapshot-icons');
      icons.forEach(icon => {
        const classes = ['stack-icon'];
        if (icon.invert) classes.push('invert');
        if (icon.size) classes.push(icon.size);
        const img = createEl('img', classes.join(' '));
        img.src = icon.src;
        img.alt = icon.name;
        img.title = icon.name;
        const px = icon.size === 'lg' ? 44 : 36;
        img.width = px;
        img.height = px;
        img.loading = 'lazy';
        img.decoding = 'async';
        row.append(img);
      });
      return row;
    }

    function renderHero(hero) {
      const identity = document.getElementById('hero-identity');
      const snapshot = document.getElementById('hero-snapshot');


      identity.replaceChildren();
      snapshot.replaceChildren();


      const name = createEl('h1', 'hero-name');
      hero.name.forEach((part, index) => {
        if (index > 0) name.append(document.createElement('br'));
        const node = part.accent ? createEl('span', 'accent', part.text) : document.createTextNode(part.text);
        name.append(node);
      });
      identity.append(name);
      identity.append(createEl('p', 'hero-loc', hero.location));

      const tagline = createEl('p', 'hero-tagline');
      appendLines(tagline, hero.tagline);
      identity.append(tagline);

      hero.snapshot.forEach(item => {
        const row = createEl('div', 'snapshot-item');
        row.append(createEl('span', 'snapshot-label', item.label));
        if (item.icons && item.icons.length) {
          row.append(createStackIcons(item.icons));
        } else {
          const copy = createEl('span', 'snapshot-copy');
          appendHighlightedText(copy, item.text, item.highlightTerms || []);
          row.append(copy);
        }
        snapshot.append(row);
      });

    }

      section.append(bio);

      const card = createEl('div', 'about-card glass reveal');
      about.facts.forEach(fact => card.append(createEl('p', '', fact)));
      section.append(card);

    function createList(items, highlights = []) {
      const list = createEl('ul');
      items.forEach(item => {
        const li = createEl('li');
        appendHighlightedText(li, item.text, highlights);
        if (item.children && item.children.length) {
          li.append(createList(item.children.map(child => ({ text: child })), highlights));
        }
        list.append(li);
      });
      return list;
    }

      if (block.type === 'list') return createList(block.items, highlights);
      if (block.type === 'subhead') return createEl('p', 'tl-subhead', block.text);

      appendHighlightedText(p, block.text, highlights);

      section.replaceChildren();
      section.append(createEl('p', 'eyebrow reveal', experience.eyebrow));
      section.append(createEl('h2', 'section-title reveal', experience.title));

      const timeline = createEl('div', 'timeline');
      const highlights = experience.highlightTerms || [];

      experience.items.forEach((item, index) => {
        const timelineItem = createEl('div', 'tl-item reveal');
        timelineItem.append(createEl('div', item.current ? 'tl-dot active' : 'tl-dot'));

        const card = createEl('div', 'tl-card glass');
        const header = createEl('button', 'tl-header');
        header.type = 'button';
        header.setAttribute('aria-expanded', 'false');
        header.setAttribute('aria-controls', `experience-${index}`);

        const row = createEl('div', 'tl-row');
        row.append(createEl('h3', 'tl-title', item.title));
        row.append(createEl('span', 'tl-date', item.date));
        header.append(row);
        header.append(createEl('p', 'tl-company', item.company));
        header.append(createEl('p', 'tl-loc', item.location));

        const body = createEl('div', 'tl-body');
        body.id = `experience-${index}`;
        body.hidden = true;

        const inner = createEl('div', 'tl-body-inner');
        const copy = createEl('div', 'tl-copy');
        item.details.forEach(block => copy.append(renderDetailBlock(block, highlights)));
        inner.append(copy);
        inner.append(createTagRow(item.tags));
        body.append(inner);

        card.append(header, body);
        timelineItem.append(card);
        timeline.append(timelineItem);
      });

      section.append(timeline);
    }

    function renderProjects(projects) {
      const section = document.getElementById('projects');
      section.replaceChildren();
      section.append(createEl('p', 'eyebrow reveal', projects.eyebrow));
      section.append(createEl('h2', 'section-title reveal', projects.title));

      const grid = createEl('div', 'projects-grid');

      projects.items.forEach(project => {
        const card = createEl(project.url ? 'a' : 'article', 'proj-card glass reveal');
        if (project.url) {
          card.href = project.url;
          card.target = '_blank';
          card.rel = 'noopener';
          card.setAttribute('aria-label', project.ariaLabel);
        }

        const content = createEl('div', 'proj-content');
        const text = createEl('div', 'proj-text');
        text.append(createEl('p', 'proj-num', project.number));
        text.append(createEl('h3', 'proj-title', project.title));
        text.append(createEl('p', 'proj-desc', project.description));

        if (project.features && project.features.length) {
          const features = createEl('ul', 'proj-features');
          project.features.forEach(feature => features.append(createEl('li', '', feature)));
          text.append(features);
        }

        const tags = createTagRow(project.tags);
        tags.style.marginBottom = '0';
        text.append(tags);

        if (project.url && project.linkLabel) {
          const link = createEl('span', 'proj-link', `${project.linkLabel} \u2192`);
          text.append(link);
        }

        const image = createEl('img', 'proj-thumb');
        image.src = project.image;
        image.alt = project.imageAlt;

        content.append(text, image);
        card.append(content);
        grid.append(card);
      });

      section.append(grid);
    }

    function renderContact(contact) {
      const section = document.getElementById('contact');
      section.replaceChildren();
      section.append(createEl('p', 'eyebrow reveal', contact.eyebrow));
      section.append(createEl('h2', 'section-title reveal', contact.title));

      const icons = createEl('div', 'connect-icons reveal');
      contact.methods.forEach(method => {
        const link = createEl('a', 'connect-btn');
        link.href = method.href;
        link.setAttribute('aria-label', method.ariaLabel);
        if (method.external) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
        link.append(createSvgIcon(method.icon));
        link.append(createEl('span', '', method.label));
        icons.append(link);
      });

      section.append(icons);
    }

    function renderFooter(footer) {
      const el = document.getElementById('site-footer');
      el.replaceChildren();
      el.append(createEl('p', '', footer.copyrightTemplate.replace('{year}', new Date().getFullYear())));

      const nav = createEl('nav', 'footer-nav');
      footer.nav.forEach(item => {
        const link = createEl('a', '', item.label);
        link.href = item.href;
        nav.append(link);
      });
      el.append(nav);
    }

    function renderContent(content) {
      document.title = content.site.title;
      document.querySelector('meta[name="description"]').setAttribute('content', content.site.description);

      renderHero(content.hero);
      renderAbout(content.about);
      renderExperience(content.experience);
      renderProjects(content.projects);
      renderContact(content.contact);
      renderFooter(content.footer);
      app.hidden = false;
    }

    function initCursor() {
      const cursor = document.getElementById('cursor-atom');
      if (!cursor || window.matchMedia('(pointer: coarse)').matches) return;
      document.body.classList.add('custom-cursor');

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let cursorX = mouseX;
      let cursorY = mouseY;

      document.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      }, { passive: true });

      document.querySelectorAll('a, button, .proj-card, .tl-card, .snapshot-item').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });

      (function cursorFrame() {
        cursorX += (mouseX - cursorX) * 0.22;
        cursorY += (mouseY - cursorY) * 0.22;
        cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0) translate(-50%, -50%)`;
        requestAnimationFrame(cursorFrame);
      })();
    }

    function setTimelineExpanded(card, expanded) {
      const header = card.querySelector('.tl-header');
      const body = card.querySelector('.tl-body');
      const inner = card.querySelector('.tl-body-inner');

      if (expanded) {
        body.hidden = false;
        body.style.height = '0px';
        body.style.opacity = '0';
        card.classList.add('expanded');
        header.setAttribute('aria-expanded', 'true');

        requestAnimationFrame(() => {
          body.style.height = `${inner.offsetHeight}px`;
          body.style.opacity = '1';
        });
        return;
      }

      body.style.height = `${inner.offsetHeight}px`;
      body.style.opacity = '1';
      body.offsetHeight;
      card.classList.remove('expanded');
      header.setAttribute('aria-expanded', 'false');

      requestAnimationFrame(() => {
        body.style.height = '0px';
        body.style.opacity = '0';
      });
    }

    function initTimeline() {
      document.querySelectorAll('.tl-card').forEach(card => {
        const header = card.querySelector('.tl-header');
        const body = card.querySelector('.tl-body');

        header.addEventListener('click', () => {
          setTimelineExpanded(card, !card.classList.contains('expanded'));
        });

        body.addEventListener('transitionend', event => {
          if (event.propertyName !== 'height') return;
          if (card.classList.contains('expanded')) {
            body.style.height = 'auto';
          } else {
            body.hidden = true;
          }
        });
      });
    }

    function initReveal() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const peers = [...entry.target.parentElement.querySelectorAll('.reveal:not(.in)')];
          const idx = peers.indexOf(entry.target);
          setTimeout(() => entry.target.classList.add('in'), Math.max(0, idx) * 88);
          io.unobserve(entry.target);
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -16px 0px' });

      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    function initParticleNetwork() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      const mobile = window.innerWidth < 600;
      const count = mobile ? 42 : 68;
      const linkDistance = mobile ? 100 : 130;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize, { passive: true });

      const points = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.21,
        vy: (Math.random() - 0.5) * 0.21,
        r: Math.random() * 1.1 + 0.38,
        a: Math.random() * 0.28 + 0.08
      }));

      (function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const point of points) {
          point.x += point.vx;
          point.y += point.vy;
          if (point.x < 0) point.x = canvas.width;
          if (point.x > canvas.width) point.x = 0;
          if (point.y < 0) point.y = canvas.height;
          if (point.y > canvas.height) point.y = 0;

          ctx.beginPath();
          ctx.arc(point.x, point.y, point.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200,151,58,${point.a})`;
          ctx.fill();
        }

        ctx.lineWidth = 0.5;
        for (let i = 0; i < points.length; i++) {
          for (let j = i + 1; j < points.length; j++) {
            const dx = points[i].x - points[j].x;
            const dy = points[i].y - points[j].y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < linkDistance) {
              ctx.beginPath();
              ctx.strokeStyle = `rgba(200,151,58,${0.07 * (1 - d / linkDistance)})`;
              ctx.moveTo(points[i].x, points[i].y);
              ctx.lineTo(points[j].x, points[j].y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(frame);
      })();
    }

    function loadContent() {
      renderContent(siteContent);
      initCursor();
      initTimeline();
      initReveal();
    }

    initParticleNetwork();
    loadContent();
  </script>

</body>
</html>
