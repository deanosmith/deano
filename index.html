<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dean M. Smith - Data Platform Engineer based in Copenhagen." />
  <meta name="theme-color" content="#0A0E1A" />
  <meta name="color-scheme" content="dark" />
  <title>Dean M. Smith</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0A0E1A;
      --bg-2: #101628;
      --bg-3: #161D33;
      --bronze: #CD9B50;
      --bronze-bright: #E2B86A;
      --bronze-deep: #8A6230;
      --text: #FAFAFA;
      --muted: #71717A;
      --border: rgba(205, 155, 80, 0.16);
      --glass: rgba(16, 22, 40, 0.58);
      --r: 20px;
      --r-pill: 100px;
      --font-display: "Cormorant Garamond", Palatino, "Times New Roman", serif;
      --font-body: Outfit, "SF Pro Text", "Helvetica Neue", sans-serif;
      --ease: cubic-bezier(.22, .61, .36, 1);
      --nav-sx: 1;
      --nav-sy: 1;
    }

    html, body { background: var(--bg); color: var(--text); }
    html { scrollbar-width: thin; scrollbar-color: var(--bronze) var(--bg); }
    body {
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      cursor: none;
      touch-action: pan-y;
    }
    body.no-webgl {
      background:
        radial-gradient(ellipse at 72% 38%, rgba(205, 155, 80, 0.14), transparent 42%),
        radial-gradient(ellipse at 20% 80%, #161D33, var(--bg) 55%);
    }
    body.custom-cursor,
    body.custom-cursor * { cursor: none !important; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    img { max-width: 100%; display: block; }

    .skip {
      position: absolute; left: 16px; top: -48px; z-index: 300;
      background: var(--bronze); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    }
    .skip:focus { top: 16px; }

    #cosmos, #wake {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    #wake { z-index: 1; }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 40%, transparent 42%, rgba(10, 14, 26, 0.55) 100%),
        linear-gradient(180deg, rgba(10,14,26,0.35) 0%, transparent 18%, transparent 82%, rgba(10,14,26,0.5) 100%);
    }
    .grain {
      position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0.055;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    #cursor {
      position: fixed; top: 0; left: 0; width: 44px; height: 44px;
      pointer-events: none; z-index: 200;
      transform: translate3d(-50%, -50%, 0);
      will-change: transform;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #cursor.on { opacity: 1; }
    #cursor.out { opacity: 0; }
    .cursor-ring, .cursor-core, .cursor-photon {
      position: absolute; left: 50%; top: 50%; border-radius: 50%;
    }
    .cursor-ring {
      width: 34px; height: 34px; margin: -17px 0 0 -17px;
      border: 1px solid rgba(205, 155, 80, 0.7);
      box-shadow: 0 0 18px rgba(205, 155, 80, 0.35), inset 0 0 10px rgba(205, 155, 80, 0.15);
      transition: transform 0.35s var(--ease), border-color 0.3s, opacity 0.3s;
    }
    .cursor-core {
      width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
      background: var(--text);
      box-shadow: 0 0 16px var(--bronze-bright), 0 0 32px var(--bronze);
      transition: transform 0.28s var(--ease), background 0.28s;
      z-index: 2;
    }
    .cursor-photon {
      width: 4px; height: 4px; margin: -2px 0 0 -2px;
      background: var(--bronze-bright);
      box-shadow: 0 0 10px var(--bronze);
      animation: photon 1.6s linear infinite;
    }
    .cursor-photon.alt {
      width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
      animation-duration: 2.1s; animation-direction: reverse;
      background: var(--text);
    }
    #cursor.hover .cursor-ring {
      transform: scale(1.85);
      border-color: var(--bronze-bright);
      box-shadow: 0 0 28px rgba(205, 155, 80, 0.55);
    }
    #cursor.hover .cursor-core {
      transform: scale(0.45);
      background: #000;
      box-shadow: 0 0 0 2px var(--bronze-bright), 0 0 22px var(--bronze);
    }
    @keyframes photon {
      0%   { transform: rotate(0deg) translate(14px) scale(1); opacity: 1; }
      50%  { transform: rotate(180deg) translate(14px) scale(0.55); opacity: 0.35; }
      100% { transform: rotate(360deg) translate(14px) scale(1); opacity: 1; }
    }

    .loader {
      position: fixed; inset: 0; z-index: 250;
      display: grid; place-items: center;
      background: var(--bg);
      transition: opacity 1s var(--ease), visibility 1s;
    }
    .loader.is-done { opacity: 0; visibility: hidden; }
    .loader-mark { text-align: center; }
    .loader-disk {
      width: 92px; height: 92px; margin: 0 auto 22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #000 0 28%, transparent 29%),
        conic-gradient(from 0deg, transparent, var(--bronze-bright), var(--bronze), transparent 62%);
      animation: spin 1.6s linear infinite;
      filter: drop-shadow(0 0 24px rgba(205, 155, 80, 0.45));
    }
    .loader p {
      font-family: var(--font-body);
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--bronze);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sig {
      position: fixed; top: 26px; left: 28px; z-index: 80;
      font-family: var(--font-display); font-size: 14px; letter-spacing: 0.06em;
      color: var(--text); mix-blend-mode: normal;
      transition: color 0.25s;
    }
    .sig:hover { color: var(--bronze-bright); }

    .progress-orbit {
      position: fixed; top: 22px; right: 24px; z-index: 80;
      width: 46px; height: 46px;
    }
    .progress-orbit svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .progress-orbit circle { fill: none; stroke-width: 1.6; }
    .progress-orbit .track { stroke: rgba(205, 155, 80, 0.18); }
    .progress-orbit .fill {
      stroke: var(--bronze);
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      filter: drop-shadow(0 0 6px var(--bronze));
    }

    .orbit-nav {
      position: fixed; left: 50%; bottom: 26px; z-index: 80;
      transform: translateX(-50%) scale(var(--nav-sx), var(--nav-sy));
      transform-origin: 50% 100%;
      display: flex; gap: 4px; padding: 8px;
      background: rgba(16, 22, 40, 0.72);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s linear;
    }
    .orbit-nav a {
      position: relative;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--muted);
      border-radius: var(--r-pill);
      transition: color 0.25s, background 0.25s;
    }
    .orbit-nav a:hover,
    .orbit-nav a.is-active { color: var(--text); }
    .orbit-nav a.is-active {
      background: rgba(205, 155, 80, 0.12);
      color: var(--bronze-bright);
    }

    #scroll-root { height: 720vh; pointer-events: none; }

    #stage {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none;
      perspective: 1400px;
    }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--bronze);
      outline-offset: 3px;
    }
    .scene.is-live > * { pointer-events: auto; }

    .scene {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 88px 7vw 108px;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 0, -160px) scale(0.92);
      transform-origin: 50% 45%;
      will-change: transform, opacity;
    }
    #hero { opacity: 1; transform: none; }
    .scene.is-live { pointer-events: auto; }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--bronze);
      margin-bottom: 12px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(34px, 4.4vw, 58px);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.08;
      margin-bottom: 28px;
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--r);
      backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
      box-shadow: inset 0 1px 0 rgba(250, 250, 250, 0.04), 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .hero-stage {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: center;
    }
    .hero-copy { position: relative; z-index: 1; }
    .name-orbit {
      position: absolute; left: -8%; top: -18%; width: 118%; height: 150%;
      pointer-events: none; opacity: 0.45;
    }
    .name-orbit ellipse {
      fill: none;
      stroke: var(--bronze);
      stroke-width: 0.6;
      stroke-dasharray: 8 14;
      opacity: 0.55;
      animation: dash 28s linear infinite;
    }
    @keyframes dash { to { stroke-dashoffset: -400; } }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(52px, 8.4vw, 124px);
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 0.9;
      perspective: 600px;
      text-shadow: 0 0 40px rgba(10, 14, 26, 0.85);
    }
    .hero-name .accent { color: var(--bronze); text-shadow: 0 0 48px rgba(205, 155, 80, 0.35); }
    .hero-name .char {
      display: inline-block;
      opacity: 0;
      animation: charIn 1.1s var(--ease) forwards;
    }
    @keyframes charIn {
      from { opacity: 0; transform: translateY(48px) rotateX(50deg); filter: blur(8px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    .hero-loc {
      margin: 22px 0 16px;
      font-size: 14px;
      color: var(--bronze-bright);
      letter-spacing: 0.04em;
      opacity: 0; animation: rise 1s var(--ease) 0.55s forwards;
    }
    .hero-tagline {
      max-width: 420px;
      font-size: 17px;
      line-height: 1.75;
      font-weight: 300;
      color: var(--text);
      opacity: 0; animation: rise 1s var(--ease) 0.75s forwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    .hero-moons {
      display: grid; gap: 12px;
      opacity: 0; animation: rise 1s var(--ease) 0.95s forwards;
    }
    .moon-card {
      padding: 16px 18px;
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 12px;
      align-items: center;
      transition: transform 0.35s var(--ease), border-color 0.35s, box-shadow 0.35s;
    }
    .moon-card:hover {
      border-color: rgba(205, 155, 80, 0.38);
      box-shadow: 0 0 40px rgba(205, 155, 80, 0.12);
    }
    .moon-label { font-size: 12px; color: var(--bronze); letter-spacing: 0.08em; }
    .moon-copy { font-size: 14px; line-height: 1.5; color: var(--text); }
    .moon-copy strong { color: var(--bronze-bright); font-weight: 500; }
    .snapshot-icons { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .stack-icon {
      width: 30px; height: 30px; object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(205, 155, 80, 0.16));
    }
    .stack-icon.invert { filter: invert(1) drop-shadow(0 0 8px rgba(205, 155, 80, 0.16)); }
    .stack-icon.lg { width: 36px; height: 36px; }

    .scroll-hint {
      position: absolute; left: 7vw; bottom: 116px;
      display: flex; align-items: center; gap: 14px;
      opacity: 0; animation: rise 1s var(--ease) 1.2s forwards;
      z-index: 2; pointer-events: none;
    }
    .scroll-comet {
      width: 46px; height: 1px; background: var(--border); position: relative; overflow: hidden;
    }
    .scroll-comet::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, var(--bronze-bright));
      animation: sweep 2.2s ease-in-out infinite;
    }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .scroll-hint span { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }

    .about-panel { width: min(760px, 100%); text-align: left; }
    .about-bio {
      font-size: 18px; line-height: 1.85; font-weight: 300; margin-bottom: 28px;
    }
    .about-bio strong { color: var(--bronze-bright); font-weight: 500; }
    .fact-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .fact-chip {
      padding: 12px 18px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      border-radius: var(--r-pill);
    }

    .exp-layout {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }
    .dossiers { position: relative; min-height: 320px; }
    .dossier {
      position: absolute; inset: auto 0 auto 0; width: 100%;
      opacity: 0; pointer-events: none; visibility: hidden;
      transform: translate3d(0, 28px, 0) scale(0.98);
      transition: opacity 0.55s var(--ease), transform 0.7s var(--ease), visibility 0.55s;
    }
    .dossier.is-active {
      position: relative;
      opacity: 1; pointer-events: auto; visibility: visible;
      transform: none;
    }
    .tl-card { padding: 28px 30px; }
    .tl-header {
      display: block; width: 100%;
      appearance: none; border: 0; background: transparent;
      text-align: left; cursor: pointer; user-select: none;
      padding-right: 28px; position: relative;
    }
    .tl-header::after {
      content: '+';
      position: absolute; right: 0; top: 0;
      color: var(--bronze); font-size: 22px; font-weight: 300; line-height: 1;
    }
    .tl-card.expanded .tl-header::after { content: '–'; }
    .tl-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    .tl-title { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .tl-date { font-size: 14px; color: var(--muted); }
    .tl-company { font-size: 15px; color: var(--bronze); margin-bottom: 4px; }
    .tl-loc { font-size: 13px; color: var(--muted); }
    .tl-body {
      height: 0; overflow: hidden; opacity: 0; margin-top: 0;
      transition: height 0.34s var(--ease), opacity 0.22s ease, margin-top 0.24s ease;
    }
    .tl-card.expanded .tl-body { opacity: 1; margin-top: 16px; }
    .tl-copy { font-size: 14px; line-height: 1.72; opacity: 0.88; margin-bottom: 16px; }
    .tl-copy p + p, .tl-copy ul + p, .tl-copy p + ul { margin-top: 12px; }
    .tl-copy ul { margin: 8px 0 14px 18px; }
    .tl-copy ul ul { margin: 6px 0 8px 18px; list-style-type: circle; }
    .tl-copy li { margin: 5px 0; }
    .tl-copy li::marker, .tl-subhead { color: var(--bronze); }
    .tl-subhead { font-weight: 500; }
    .tl-copy strong { color: var(--bronze-bright); font-weight: 500; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 12px; padding: 4px 12px;
      border: 1px solid var(--border); border-radius: var(--r-pill); color: var(--text);
    }

    .orrery-wrap { display: grid; place-items: center; }
    .orrery {
      position: relative;
      width: min(520px, 46vw);
      aspect-ratio: 1;
      filter: drop-shadow(0 0 40px rgba(205, 155, 80, 0.08));
    }
    .star {
      position: absolute; left: 50%; top: 50%;
      width: 28px; height: 28px; margin: -14px 0 0 -14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff 0, var(--bronze-bright) 28%, var(--bronze-deep) 70%, transparent 72%);
      box-shadow: 0 0 28px var(--bronze), 0 0 64px rgba(205, 155, 80, 0.4);
      animation: pulse 3.4s ease-in-out infinite;
      z-index: 8;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.08); filter: brightness(1.25); }
    }
    .ring {
      position: absolute; left: 50%; top: 50%;
      width: var(--w); height: calc(var(--w) * 0.38);
      margin: calc(var(--w) * -0.19) 0 0 calc(var(--w) * -0.5);
      border: 1px solid rgba(205, 155, 80, 0.18);
      border-radius: 50%;
      pointer-events: none;
    }
    .planet {
      position: absolute; left: 50%; top: 50%;
      width: var(--s); height: var(--s);
      margin: 0;
      border: 0;
      border-radius: 50%;
      overflow: visible;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 4;
      box-shadow: inset -8px -6px 14px rgba(0,0,0,0.45), 0 0 16px rgba(205, 155, 80, 0.25);
      transition: box-shadow 0.4s, outline 0.3s;
    }
    .planet.is-active {
      box-shadow: inset -8px -6px 14px rgba(0,0,0,0.35), 0 0 28px var(--bronze), 0 0 60px rgba(205, 155, 80, 0.35);
      outline: 2px solid rgba(226, 184, 106, 0.55);
      outline-offset: 4px;
    }
    .planet[data-body="0"] { background: radial-gradient(circle at 32% 30%, #f3e0b0, #CD9B50 42%, #5a3b14 78%); }
    .planet[data-body="1"] { background: radial-gradient(circle at 32% 30%, #d7c4a0, #9a7a4a 50%, #2d2418 80%); }
    .planet[data-body="2"] { background: radial-gradient(circle at 32% 30%, #e8d3a4, #b8894a 48%, #3a2a16 82%); }
    .planet[data-body="3"] { background: radial-gradient(circle at 32% 30%, #c4a882, #7a5a32 55%, #1c1610 85%); }
    .planet[data-body="4"] { background: radial-gradient(circle at 32% 30%, #f7f3ea, #cfc6b4 40%, #6a655c 78%); }
    .planet-ring {
      position: absolute; left: 50%; top: 50%;
      width: 220%; height: 52%;
      transform: translate(-50%, -50%) rotate(-18deg);
      border: 1px solid rgba(205, 155, 80, 0.45);
      border-radius: 50%;
      pointer-events: none;
    }
    .orrery-caption {
      margin-top: 18px; text-align: center;
      font-size: 13px; letter-spacing: 0.08em; color: var(--muted);
    }
    .orrery-caption strong { color: var(--bronze-bright); font-weight: 500; }

    .proj-shell { width: 100%; overflow: hidden; }
    .proj-track {
      display: flex; gap: 28px;
      padding: 12px 8vw 20px;
      will-change: transform;
    }
    .proj-card {
      flex: 0 0 min(640px, 78vw);
      padding: 32px;
      display: block;
      transform-style: preserve-3d;
      transition: border-color 0.35s, box-shadow 0.35s;
    }
    .proj-card:hover {
      border-color: rgba(205, 155, 80, 0.4);
      box-shadow: 0 0 50px rgba(205, 155, 80, 0.14), 0 20px 60px rgba(0,0,0,0.35);
    }
    .proj-content { display: flex; gap: 24px; align-items: flex-start; }
    .proj-text { flex: 1; min-width: 0; }
    .proj-num { font-size: 12px; color: var(--bronze); letter-spacing: 0.12em; margin-bottom: 12px; }
    .proj-title { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin-bottom: 10px; }
    .proj-desc { font-size: 16px; line-height: 1.7; margin-bottom: 18px; font-weight: 300; }
    .proj-link { display: inline-block; margin-top: 16px; font-size: 13px; color: var(--bronze); letter-spacing: 0.04em; }
    .proj-visual {
      position: relative;
      width: min(42%, 220px); flex-shrink: 0;
      aspect-ratio: 4 / 3;
    }
    .proj-visual::before {
      content: '';
      position: absolute; inset: -10% -14%;
      border: 1px solid rgba(205, 155, 80, 0.2);
      border-radius: 50%;
      transform: rotateX(66deg);
      pointer-events: none;
    }
    .proj-thumb {
      width: 100%; height: 100%; object-fit: contain; padding: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .proj-visual.no-image .proj-thumb { display: none; }
    .proj-visual.no-image {
      background: radial-gradient(circle at 35% 30%, var(--bronze-bright), var(--bronze-deep) 60%, #0A0E1A 78%);
      border-radius: 50%;
      aspect-ratio: 1;
      width: 140px;
      box-shadow: inset -16px -10px 24px rgba(0,0,0,0.45), 0 0 32px rgba(205, 155, 80, 0.25);
    }
    .proj-visual.no-image::before { inset: -18%; }

    #contact { flex-direction: column; justify-content: center; }
    .contact-block { display: grid; place-items: center; text-align: center; }
    .singularity {
      position: relative;
      width: min(520px, 86vw);
      height: min(520px, 86vw);
      margin-top: 8px;
    }
    .singularity-core {
      position: absolute; left: 50%; top: 50%;
      width: 86px; height: 86px; margin: -43px 0 0 -43px;
      border-radius: 50%; background: #000;

    function envelope(p, a, b, c, d) {
      if (p < a || p >= d) return 0;
      if (p < b) {
        const t = (p - a) / Math.max(0.0001, b - a);
        return t * t * (3 - 2 * t);
      }
      if (p > c) {
        const t = (p - c) / Math.max(0.0001, d - c);
        return 1 - t * t * (3 - 2 * t);
      }
      return 1;
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    function maxScroll() {
      return Math.max(1, document.documentElement.scrollHeight - window.innerHeight);

    function scrollToProgress(p) {
      window.scrollTo({ top: clamp(p, 0, 1) * maxScroll(), behavior: reduceMotion ? 'auto' : 'smooth' });
    }

    const Cosmos = {
      gl: null,
      bg: null,
      stars: null,
      starCount: 0,
      dpr: 1,
      init() {
        const canvas = document.getElementById('cosmos');
        const gl = canvas.getContext('webgl', { alpha: false, antialias: false, powerPreference: 'high-performance' });
        if (!gl) return false;
        this.gl = gl;
        this.bg = this.program(
          `attribute vec2 a;
           void main(){ gl_Position = vec4(a,0.0,1.0); }`,
          `precision highp float;
           uniform vec2 uRes;
           uniform float uTime;
           uniform vec2 uMouse;
           uniform float uCamZ;
           uniform float uBH;
           uniform vec2 uBHPos;
           uniform vec3 uTint;
           float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
           float n2(vec2 p){
             vec2 i=floor(p), f=fract(p);
             f=f*f*(3.0-2.0*f);
             return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x), mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x), f.y);
           }
           float fbm(vec2 p){
             float v=0.0; float a=0.5;
             for(int i=0;i<5;i++){ v+=a*n2(p); p*=2.13; a*=0.5; }
             return v;
           }
           void main(){
             vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
             vec2 mouse = (uMouse - 0.5) * vec2(uRes.x/uRes.y, 1.0);
             vec2 toM = uv - mouse;
             float md = length(toM);
             uv += toM * (0.018 / (md + 0.08));

             vec2 p = uv - uBHPos;
             float r = length(p);
             float ang = atan(p.y, p.x);
             float warp = uBH * 0.16 / (r + 0.045);
             ang += warp * 1.7;
             vec2 duv = uBHPos + vec2(cos(ang), sin(ang)) * r;

             vec3 col = vec3(0.039, 0.055, 0.102);
             float neb = fbm(duv * 1.35 + vec2(0.0, uCamZ * 0.12) + uTime * 0.015);
             col += uTint * neb * 0.22;
             col += vec3(0.07, 0.05, 0.12) * fbm(duv * 2.4 - 8.0) * 0.18;

             float stars = 0.0;
             for (int i = 0; i < 3; i++) {
               float sc = 55.0 + float(i) * 70.0;
               vec2 su = duv * sc + vec2(0.0, uCamZ * (0.8 + float(i)));
               vec2 id = floor(su);
               vec2 f = fract(su) - 0.5;
               float h = hash(id + vec2(float(i) * 17.0, float(i) * 9.0));
               float d = length(f);
               stars += smoothstep(0.018 + h * 0.02, 0.0, d) * step(0.91, h) * (0.45 + 0.55 * h);
             }
             col += vec3(0.98, 0.95, 0.88) * stars;

             vec2 dp = p;
             dp.y *= 3.15;
             float dr = length(dp);
             float disk = smoothstep(0.04, 0.11, dr) * smoothstep(0.72, 0.2, dr);
             float swirl = fbm(vec2(ang * 1.4 + uTime * 0.22, dr * 6.0));
             disk *= (0.45 + swirl) * (0.7 + 0.55 * clamp(p.x * 2.2 + 0.5, 0.15, 1.25));
             vec3 heat = mix(vec3(0.804, 0.608, 0.314), vec3(0.984, 0.749, 0.141), smoothstep(0.45, 0.1, dr));
             col += heat * disk * uBH * 1.85;

             float ring = smoothstep(0.11, 0.08, r) * smoothstep(0.05, 0.08, r);
             col += vec3(0.95, 0.82, 0.52) * ring * uBH * 2.2;
             col *= mix(1.0, smoothstep(0.0, 0.06, r), clamp(uBH, 0.0, 1.0));
             col += (0.028 / (r + 0.018)) * heat * uBH * 0.7;

             float vig = smoothstep(1.35, 0.35, length(uv));
             col *= vig;
             gl_FragColor = vec4(col, 1.0);
           }`
        );
        this.stars = this.program(
          `attribute vec4 aData;
           uniform float uCamZ;
           uniform float uAspect;
           uniform float uVel;
           uniform float uDpr;
           varying float vA;
           varying float vStreak;
           void main(){
             float pz = fract(aData.z - uCamZ);
             float zEye = mix(13.0, 0.42, pz);
             vec3 P = vec3(aData.x * 7.0, aData.y * 4.4, zEye);
             vec2 proj = P.xy / P.z;
             gl_Position = vec4(proj.x / uAspect, proj.y, pz * 0.2, 1.0);
             gl_PointSize = clamp((aData.w * 86.0) / P.z, 1.0, 8.5) * uDpr;
             vA = (0.2 + aData.w * 0.8) * smoothstep(0.0, 0.08, pz) * smoothstep(1.0, 0.82, pz);
             vStreak = abs(uVel);
           }`,
          `precision mediump float;
           varying float vA;
           varying float vStreak;
           void main(){
             vec2 uv = gl_PointCoord - 0.5;
             uv.y *= 1.0 + vStreak * 14.0;
             float d = length(uv);
             float g = smoothstep(0.5, 0.0, d);
             gl_FragColor = vec4(vec3(0.98, 0.93, 0.8) * g, g * vA);
           }`
        );
        const quad = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quad);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        this.quad = quad;

        this.starCount = mobile() ? 520 : 1300;
        const data = new Float32Array(this.starCount * 4);
        for (let i = 0; i < this.starCount; i++) {
          data[i*4] = Math.random() * 2 - 1;
          data[i*4+1] = Math.random() * 2 - 1;
          data[i*4+2] = Math.random();
          data[i*4+3] = Math.random();
        }
        this.starBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.starBuf);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        this.resize();
        return true;
      },
      program(vsSrc, fsSrc) {
        const gl = this.gl;
        const compile = (type, src) => {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            console.warn(gl.getShaderInfoLog(s));
          }
          return s;
        };
        const vs = compile(gl.VERTEX_SHADER, vsSrc);
        const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
        const p = gl.createProgram();
        gl.attachShader(p, vs);
        gl.attachShader(p, fs);
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
          console.warn(gl.getProgramInfoLog(p));
        }
        p.unifs = {};
        const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
        for (let i = 0; i < n; i++) {
          const name = gl.getActiveUniform(p, i).name;
          p.unifs[name] = gl.getUniformLocation(p, name);
        }
        return p;
      },
      resize() {
        if (!this.gl) return;
        const canvas = this.gl.canvas;
        this.dpr = Math.min(window.devicePixelRatio || 1, mobile() ? 1.15 : 1.75);
        canvas.width = Math.floor(window.innerWidth * this.dpr);
        canvas.height = Math.floor(window.innerHeight * this.dpr);
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        this.gl.viewport(0, 0, canvas.width, canvas.height);
      },
      render(s) {
        const gl = this.gl;
        if (!gl) return;
        const w = gl.canvas.width;
        const h = gl.canvas.height;
        const p = s.current;
        const bhA = envelope(p, 0.0, 0.0, 0.12, 0.24);
        const bhB = envelope(p, 0.82, 0.90, 1.0, 1.1);
        const bh = Math.max(bhA * 1.05, bhB * 1.2);
        const bhX = lerp(0.34, 0.0, envelope(p, 0.78, 0.88, 1.0, 1.1));
        const tint = [
          lerp(0.35, 0.55, envelope(p, 0.15, 0.22, 0.3, 0.4)),
          lerp(0.22, 0.28, p),
          lerp(0.12, 0.22, envelope(p, 0.6, 0.7, 0.8, 0.9))
        ];

        gl.disable(gl.BLEND);
        gl.useProgram(this.bg);
        gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
        const a = gl.getAttribLocation(this.bg, 'a');
        gl.enableVertexAttribArray(a);
        gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
        gl.uniform2f(this.bg.unifs.uRes, w, h);
        gl.uniform1f(this.bg.unifs.uTime, s.time);
        gl.uniform2f(this.bg.unifs.uMouse, s.mouse.x, 1.0 - s.mouse.y);
        gl.uniform1f(this.bg.unifs.uCamZ, s.current * 6.5 + s.velocity * 8.0);
        gl.uniform1f(this.bg.unifs.uBH, bh);
        gl.uniform2f(this.bg.unifs.uBHPos, bhX, 0.02);
        gl.uniform3f(this.bg.unifs.uTint, 0.804 * tint[0], 0.608 * tint[1], 0.314 * tint[2]);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        gl.useProgram(this.stars);
        gl.bindBuffer(gl.ARRAY_BUFFER, this.starBuf);
        const ad = gl.getAttribLocation(this.stars, 'aData');
        gl.enableVertexAttribArray(ad);
        gl.vertexAttribPointer(ad, 4, gl.FLOAT, false, 0, 0);
        gl.uniform1f(this.stars.unifs.uCamZ, s.current * 1.8 + s.time * 0.012);
        gl.uniform1f(this.stars.unifs.uAspect, w / h);
        gl.uniform1f(this.stars.unifs.uVel, Math.min(1.2, Math.abs(s.velocity) * 28.0));
        gl.uniform1f(this.stars.unifs.uDpr, this.dpr);
        gl.drawArrays(gl.POINTS, 0, this.starCount);
      }
    };

    const Wake = {
      ctx: null,
      pts: [],
      dust: [],
      w: 0,
      h: 0,
      init() {
        const canvas = document.getElementById('wake');
        this.ctx = canvas.getContext('2d');
        this.dust = Array.from({ length: 16 }, () => ({
          a: Math.random() * Math.PI * 2,
          r: 16 + Math.random() * 26,
          s: 0.35 + Math.random() * 0.9,
          z: Math.random()
        }));
        this.resize();
      },
      resize() {
        const canvas = document.getElementById('wake');
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        this.w = window.innerWidth;
        this.h = window.innerHeight;
        canvas.width = Math.floor(this.w * dpr);
        canvas.height = Math.floor(this.h * dpr);
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      },
      push(x, y) {
        const last = this.pts[this.pts.length - 1];
        const sp = last ? Math.hypot(x - last.x, y - last.y) : 0;
        this.pts.push({ x, y, a: 1, w: Math.min(16, 1.6 + sp * 0.45) });
        if (this.pts.length > 52) this.pts.shift();
      },
      draw(s) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.w, this.h);
        if (coarse) return;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 1; i < this.pts.length; i++) {
          const q = this.pts[i - 1];
          const p = this.pts[i];
          p.a *= 0.945;
          ctx.strokeStyle = `rgba(205,155,80,${p.a * 0.42})`;
          ctx.lineWidth = p.w * p.a;
          ctx.beginPath();
          ctx.moveTo(q.x, q.y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
        const cx = s.cursor.x;
        const cy = s.cursor.y;
        this.dust.forEach(d => {
          d.a += d.s * 0.02;
          const x = cx + Math.cos(d.a) * d.r;
          const y = cy + Math.sin(d.a) * d.r * 0.55;
          ctx.fillStyle = `rgba(226,184,106,${0.18 + d.z * 0.35})`;
          ctx.beginPath();
          ctx.arc(x, y, 1.1 + d.z, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';
      }
    };

    function setTimelineExpanded(card, expanded) {
      const header = card.querySelector('.tl-header');
      const body = card.querySelector('.tl-body');
      const inner = card.querySelector('.tl-body-inner');
      if (expanded) {
        body.hidden = false;
        body.style.height = '0px';
        card.classList.add('expanded');
        header.setAttribute('aria-expanded', 'true');
        requestAnimationFrame(() => {
          body.style.height = `${inner.offsetHeight}px`;
          body.style.opacity = '1';
        });
        return;
      }
      body.style.height = `${inner.offsetHeight}px`;
      body.offsetHeight;
      card.classList.remove('expanded');
      header.setAttribute('aria-expanded', 'false');
      requestAnimationFrame(() => {
        body.style.height = '0px';
        body.style.opacity = '0';
      });
    }

    function initTimeline() {
      document.querySelectorAll('.tl-card').forEach(card => {
        const header = card.querySelector('.tl-header');
        const body = card.querySelector('.tl-body');
        header.addEventListener('click', () => {
          setTimelineExpanded(card, !card.classList.contains('expanded'));
        });
        body.addEventListener('transitionend', event => {
          if (event.propertyName !== 'height') return;
          if (card.classList.contains('expanded')) body.style.height = 'auto';
          else body.hidden = true;
        });
      });
    }

    function initMagnetic() {
      if (coarse || reduceMotion) return;
      document.querySelectorAll('.magnetic').forEach(el => {
        el.addEventListener('mousemove', e => {
          const r = el.getBoundingClientRect();
          const x = (e.clientX - r.left - r.width / 2) / r.width;
          const y = (e.clientY - r.top - r.height / 2) / r.height;
          el.style.transform = `translate3d(${x * 14}px, ${y * 10}px, 0) rotateX(${-y * 8}deg) rotateY(${x * 10}deg)`;
        });
        el.addEventListener('mouseleave', () => {
          el.style.transform = '';
        });
      });
    }

    function initCursor() {
      const cursor = document.getElementById('cursor');
      if (!cursor || coarse) return;
      document.body.classList.add('custom-cursor');
      document.addEventListener('mousemove', e => {
        cursor.classList.add('on');
        state.mouse.px = e.clientX;
        state.mouse.py = e.clientY;
        state.mouse.x = e.clientX / window.innerWidth;
        state.mouse.y = e.clientY / window.innerHeight;
        Wake.push(e.clientX, e.clientY);
      }, { passive: true });
      document.addEventListener('mouseleave', () => cursor.classList.add('out'));
      document.addEventListener('mouseenter', () => cursor.classList.remove('out'));
      const hoverSel = 'a, button, .proj-card, .tl-card, .moon-card, .planet, .fact-chip';
      document.querySelectorAll(hoverSel).forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });
    }

    function initAnchors() {
      document.querySelectorAll('a[href^="#"]').forEach(link => {
        link.addEventListener('click', e => {
          const id = link.getAttribute('href').slice(1);
          if (!(id in ANCHORS) && id !== 'hero') return;
          e.preventDefault();
          scrollToProgress(ANCHORS[id] ?? 0);
        });
      });
    }

    function setExperience(index, items) {
      const dossiers = document.querySelectorAll('.dossier');
      const planets = document.querySelectorAll('.planet');
      dossiers.forEach((d, i) => d.classList.toggle('is-active', i === index));
      planets.forEach((p, i) => p.classList.toggle('is-active', i === index));
      const caption = document.getElementById('orrery-caption');
      if (caption && items[index]) {
        caption.innerHTML = `Now Viewing: <strong>${items[index].company}</strong>`;
      }
      state.expIndex = index;
    }

    function initPlanets(items) {
      document.querySelectorAll('.planet').forEach(planet => {
        planet.addEventListener('click', () => {
          const i = Number(planet.dataset.index);
          const n = items.length;
          const sub = 1 - i / Math.max(1, n - 1);
          const p = lerp(SCENE_WINDOW.experience[1], SCENE_WINDOW.experience[2], sub);
          scrollToProgress(p);
          setExperience(i, items);
        });
      });
    }

    function updateOrrery(time, items) {
      const planets = document.querySelectorAll('.planet');
      const n = planets.length;
      planets.forEach((planet, i) => {
        const speed = 0.22 / (i + 1.15);
        const radius = 35 + i * 33;
        const angle = time * speed + i * 0.85;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius * 0.38;
        const z = Math.sin(angle);
        const s = 1 + (planet.classList.contains('is-active') ? 0.22 : 0) + z * 0.08;
        planet.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${s})`;
        planet.style.zIndex = String(10 + Math.round(z * 8));
        planet.style.opacity = String(0.55 + 0.45 * (0.5 + z * 0.5));
      });
      const p = state.current;
      const [a, b, c] = SCENE_WINDOW.experience;
      if (p >= a && p <= SCENE_WINDOW.experience[3]) {
        const sub = clamp((p - b) / Math.max(0.0001, c - b), 0, 1);
        const idx = Math.round((1 - sub) * (n - 1));
        if (idx !== state.expIndex) setExperience(clamp(idx, 0, n - 1), items);
      }
    }

    function updateProjects() {
      const track = document.getElementById('proj-track');
      if (!track) return;
      const p = state.current;
      const [a, b, c, d] = SCENE_WINDOW.projects;
      const t = clamp((p - b) / Math.max(0.0001, c - b), 0, 1);
      const maxX = Math.max(0, track.scrollWidth - window.innerWidth * 0.55);
      track.style.transform = `translate3d(${-t * maxX}px, 0, 0)`;
    }

    function updateScenes() {
      const p = state.current;
      const mx = (state.mouse.x - 0.5) * 18;
      const my = (state.mouse.y - 0.5) * 12;
      document.querySelectorAll('.scene').forEach(scene => {
        const key = scene.dataset.scene;
        const win = SCENE_WINDOW[key];
        const vis = envelope(p, ...win);
        let z = 0;
        let sc = 1;
        if (p < win[1]) {
          const t = 1 - vis;
          z = -170 * t;
          sc = 0.92 + 0.08 * vis;
        } else if (p > win[2]) {
          const t = 1 - vis;
          z = 180 * t;
          sc = 1 + 0.08 * t;
        }
        scene.style.opacity = vis.toFixed(4);
        scene.style.transform = `translate3d(${mx * vis}px, ${my * vis}px, ${z}px) scale(${sc})`;
        scene.classList.toggle('is-live', vis > 0.22);
        scene.style.visibility = vis < 0.01 ? 'hidden' : 'visible';
      });

      const v = Math.min(1, Math.abs(state.velocity) * 42);
      document.documentElement.style.setProperty('--nav-sx', String(1 + v * 0.38));
      document.documentElement.style.setProperty('--nav-sy', String(1 - v * 0.24));

      const fill = document.querySelector('.progress-orbit .fill');
      if (fill) fill.style.strokeDashoffset = String(1 - p);

      const navLinks = document.querySelectorAll('.orbit-nav a');
      const active = p < 0.13 ? -1 : p < 0.32 ? 0 : p < 0.64 ? 1 : p < 0.86 ? 2 : 3;
      navLinks.forEach((link, i) => link.classList.toggle('is-active', i === active));
    }

    function frame(t) {
      state.time = t * 0.001;
      const raw = window.scrollY / maxScroll();
      state.target = clamp(raw, 0, 1);
      const ease = reduceMotion ? 1 : 0.068;
      const prev = state.current;
      state.current += (state.target - state.current) * ease;
      state.velocity = state.current - prev;

      state.cursor.x += (state.mouse.px - state.cursor.x) * 0.22;
      state.cursor.y += (state.mouse.py - state.cursor.y) * 0.22;
      const cursor = document.getElementById('cursor');
      if (cursor && !coarse) {
        cursor.style.transform = `translate3d(${state.cursor.x}px, ${state.cursor.y}px, 0) translate(-50%, -50%)`;
      }

      if (!reduceMotion) {
        updateScenes();
        updateOrrery(state.time, siteContent.experience.items);
        updateProjects();
        Cosmos.render(state);
        Wake.draw(state);
      }
      requestAnimationFrame(frame);
    }

    function bootStatic() {
      document.querySelectorAll('.scene').forEach(scene => {
        scene.style.opacity = '1';
        scene.style.transform = 'none';
        scene.style.visibility = 'visible';
        scene.classList.add('is-live');
      });
      updateOrrery(0, siteContent.experience.items);
      Cosmos.render(state);
    }

    function loadContent() {
      document.title = siteContent.site.title;
      document.querySelector('meta[name="description"]').setAttribute('content', siteContent.site.description);
      renderHero(siteContent.hero);
      renderAbout(siteContent.about);
      renderExperience(siteContent.experience);
      renderProjects(siteContent.projects);
      renderContact(siteContent.contact);
      renderFooter(siteContent.footer);
      renderNav(siteContent.footer);
      document.getElementById('stage').hidden = false;
      initTimeline();
      initMagnetic();
      initCursor();
      initAnchors();
      initPlanets(siteContent.experience.items);
    }

    Wake.init();
    const ok = Cosmos.init();
    if (!ok) document.body.classList.add('no-webgl');
    loadContent();
    applyHash();
    window.addEventListener('hashchange', applyHash);
    window.addEventListener('resize', () => {
      Cosmos.resize();
      Wake.resize();
    }, { passive: true });

    function applyHash() {
      const id = (location.hash || '').slice(1);
      if (id && id in ANCHORS) {
        const p = ANCHORS[id];
        window.scrollTo(0, p * maxScroll());
        state.target = p;
        state.current = p;
      }
    }

    function dismissLoader() {
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('is-done');
    }

    if (reduceMotion) bootStatic();
    requestAnimationFrame(frame);
    requestAnimationFrame(() => requestAnimationFrame(dismissLoader));
    window.addEventListener('load', dismissLoader);
    setTimeout(dismissLoader, 900);
  </script>
</body>
</html>
